<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Home Floorplan 3D｜原始户型结构版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#292721;font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}
header{padding:14px 20px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}small{color:#746f65}.toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #c9c2b5;background:#fff;border-radius:7px;padding:8px 13px;cursor:pointer}button.active{background:#30352f;color:#fff}
main{max-width:1300px;margin:18px auto;padding:0 14px}.panel{background:#fff;border:1px solid #ddd6ca;border-radius:12px;padding:12px;overflow:auto}
svg{width:100%;height:auto;min-width:720px;display:block}.wall{fill:#34332f}.inner{fill:#77766f}.room{stroke:#bcb6aa;stroke-width:2}.label{font-size:17px;fill:#35332d;font-weight:600;text-anchor:middle}.sub{font-size:12px;fill:#716b60;text-anchor:middle}.furn{fill:#eee9df;stroke:#777267;stroke-width:2}.door{fill:none;stroke:#8c6848;stroke-width:3}.window{stroke:#4387a9;stroke-width:5}.dim{font-size:13px;fill:#8b7657;text-anchor:middle}.note{margin:12px 2px;color:#665f54;font-size:13px}
.hide-walls .wall,.hide-walls .inner{opacity:.15}.hide-labels .label,.hide-labels .sub{display:none}
</style></head><body>
<header><div><h1>My Home Floorplan 3D｜原始户型结构版</h1><small>独立项目 · 以黑白原始图描绘空间关系 · 尺寸链独立标注</small></div>
<div class="toolbar"><button id="walls" class="active">墙体</button><button id="labels" class="active">房间标注</button><button id="openings" class="active">门窗</button><button onclick="window.print()">打印 / 导出PDF</button></div></header>
<main><div class="panel" id="drawing">
<svg viewBox="0 0 1000 820" role="img" aria-label="户型结构示意图">
<rect x="1" y="1" width="998" height="818" fill="#faf9f6"/>
<!-- Room fills: non-rectangular overall envelope, drawn from supplied black-and-white plan -->
<path class="room" fill="#eeeae2" d="M115 90 H220 V55 H710 V90 H850 V320 H920 V700 H850 V770 H115 V700 H65 V360 H115 Z"/>
<rect class="room" x="125" y="100" width="165" height="220" fill="#dfc7a2"/>
<rect class="room" x="300" y="65" width="330" height="260" fill="#dfe5e2"/>
<rect class="room" x="635" y="100" width="205" height="220" fill="#dfc7a2"/>
<rect class="room" x="65" y="365" width="225" height="125" fill="#dfe5e2"/>
<rect class="room" x="300" y="330" width="340" height="160" fill="#eeeae2"/>
<rect class="room" x="650" y="365" width="200" height="125" fill="#dfe5e2"/>
<rect class="room" x="65" y="500" width="225" height="200" fill="#dfc7a2"/>
<rect class="room" x="300" y="495" width="340" height="205" fill="#eeeae2"/>
<rect class="room" x="650" y="500" width="200" height="200" fill="#dfc7a2"/>
<rect class="room" x="865" y="325" width="55" height="180" fill="#dfe5e2"/>
<!-- Attached enclosed equipment balcony at upper-right, sharing the external wall -->
<rect x="710" y="55" width="140" height="95" fill="#dfe5e2" stroke="#34332f" stroke-width="10"/>
<path d="M710 55 H850 V150 H710" fill="none" stroke="#34332f" stroke-width="10"/>
<text x="780" y="105" class="label">设备平台</text><text x="780" y="124" class="sub">封闭并连接主体外墙</text>
<!-- Perimeter wall segments, with openings represented as windows laid over walls -->
<path class="wall" d="M115 90 H220 V55 H710 V90 H850 V320 H920 V700 H850 V770 H115 V700 H65 V360 H115 Z M135 110 V300 H270 V110 Z" fill-rule="evenodd"/>
<path class="wall" d="M290 90 V320 H305 V90 Z M625 90 V320 H640 V90 Z M290 330 V490 H305 V330 Z M635 330 V490 H650 V330 Z M290 500 V700 H305 V500 Z M635 500 V700 H650 V500 Z"/>
<path class="wall" d="M65 350 H290 V365 H65 Z M65 485 H290 V500 H65 Z M650 350 H850 V365 H650 Z M650 485 H850 V500 H650 Z"/>
<path class="wall" d="M290 700 H650 V715 H290 Z M850 700 H920 V715 H850 Z"/>
<!-- Interior partition / structural core -->
<path class="inner" d="M290 90 H305 V320 H290 Z M625 90 H640 V320 H625 Z M290 365 H305 V700 H290 Z M635 365 H650 V700 H635 Z M115 320 H290 V335 H115 Z M650 320 H850 V335 H650 Z"/>
<rect class="inner" x="850" y="320" width="15" height="385"/><rect class="inner" x="865" y="320" width="55" height="15"/>
<!-- Openings -->
<g class="window"><path d="M165 90 H250 M365 55 H485 M675 90 H790 M65 385 V455 M65 545 V675 M360 715 H540 M690 715 H800"/></g>
<g class="door"><path d="M290 230 A55 55 0 0 1 345 285 M625 230 A55 55 0 0 0 570 285 M290 405 A55 55 0 0 1 345 460 M650 405 A55 55 0 0 0 595 460 M650 555 A55 55 0 0 0 595 610"/></g>
<!-- room labels -->
<g><text x="205" y="205" class="label">左上卧室</text><text x="205" y="226" class="sub">布局按原图</text>
<text x="465" y="190" class="label">厨房</text><text x="465" y="211" class="sub">中厨 / 西厨待细分</text>
<text x="735" y="205" class="label">右上卧室</text>
<text x="175" y="420" class="label">左侧卫生间</text><text x="470" y="405" class="label">餐厅</text><text x="750" y="420" class="label">右侧卫生间</text>
<text x="175" y="605" class="label">左下卧室</text><text x="470" y="600" class="label">客厅</text><text x="750" y="605" class="label">右下卧室</text>
<text x="890" y="420" class="sub">楼梯 / 入户</text></g>
<!-- schematic furniture -->
<g class="furn"><rect x="160" y="150" width="90" height="65" rx="5"/><rect x="680" y="150" width="100" height="65" rx="5"/><rect x="130" y="550" width="100" height="115" rx="5"/><rect x="700" y="550" width="100" height="115" rx="5"/><rect x="420" y="120" width="90" height="50" rx="5"/><circle cx="470" cy="390" r="48"/><rect x="405" y="545" width="125" height="85" rx="18"/></g>
<!-- dimension chains -->
<path d="M115 30 H850 M115 45 H850 M115 790 H920 M45 90 V770 M60 90 V770" stroke="#9a8767" fill="none" stroke-width="1.5"/>
<g class="dim"><text x="482" y="24">上侧尺寸链 10,270 mm</text><text x="517" y="784">下侧尺寸链 11,850 mm</text><text x="30" y="430" transform="rotate(-90 30 430)">纵向尺寸链 10,560 mm</text></g>
</svg></div>
<p class="note"><b>重要说明：</b>这是按已提供图纸关系建立的结构核对底图，不是施工图。设备平台已画为与主体外墙相连的封闭空间；内部墙体精确坐标、承重属性、门窗净洞口和房间净面积仍需依据CAD/现场复尺校准。当前不把示意家具或面积作为实测数据。</p>
</main>
<script>
const d=document.getElementById('drawing');
function toggle(id,cls){const b=document.getElementById(id);b.onclick=()=>{b.classList.toggle('active');d.classList.toggle(cls)}}
toggle('walls','hide-walls');toggle('labels','hide-labels');
document.getElementById('openings').onclick=()=>{const els=d.querySelectorAll('.door,.window');els.forEach(e=>e.style.display=e.style.display==='none'?'':'none');document.getElementById('openings').classList.toggle('active')};
</script></body></html>
