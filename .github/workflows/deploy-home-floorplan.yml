name: Deploy My Home Floorplan 3D

on:
  push:
    branches:
      - home-floorplan-clean
    paths:
      - "home-floorplan-3d/**"
      - ".github/workflows/deploy-home-floorplan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: home-floorplan-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: home-floorplan-3d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
