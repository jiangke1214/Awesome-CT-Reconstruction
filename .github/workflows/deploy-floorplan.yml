name: Deploy custom floor plan

on:
  push:
    branches:
      - floorplan-3d-custom
    paths:
      - "floorplan-3d/**"
      - ".github/workflows/deploy-floorplan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: floorplan-3d
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
